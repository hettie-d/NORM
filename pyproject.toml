[project]
name = "norm-tests"
version = "0"
description = "Test suite for the NORM generator"
requires-python = ">=3.10,<3.13"  # pgserver has wheels for 3.10 to 3.12
dependencies = [
    "pglast>=7",
    "pgserver>=0.1.4",
    "psycopg[binary]>=3.2",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
